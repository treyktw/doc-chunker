[package]
name = "doc-chunker"
description = "Extract positioned blocks from PDF, DOCX, PPTX, HTML and Markdown, then chunk them along the document's own structure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[workspace]
members = [".", "crates/document", "crates/chunking"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
document-extract = { path = "crates/document" }
chunking = { path = "crates/chunking" }

[dependencies]
document-extract.workspace = true
chunking.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[[bin]]
name = "chunkprobe"
path = "src/main.rs"
